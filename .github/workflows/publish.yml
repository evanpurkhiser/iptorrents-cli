name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release_meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      is_versioned: ${{ steps.meta.outputs.is_versioned }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_versioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
            echo "is_versioned=false" >> "$GITHUB_OUTPUT"
          fi

  publish_crate:
    name: Publish crate to crates.io
    needs: release_meta
    if: needs.release_meta.outputs.is_versioned == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_meta.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tests pass
        run: cargo test --locked --all-targets --all-features

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_homebrew:
    name: Dispatch homebrew bump
    needs: release_meta
    if: needs.release_meta.outputs.is_versioned == 'true'
    uses: evanpurkhiser/workflows/.github/workflows/bump-homebrew.yml@main
    with:
      formula: iptorrents-cli
      version: ${{ needs.release_meta.outputs.tag_name }}
    secrets:
      token: ${{ secrets.HOMEBREW_BUMP_DISPATCH_PAT }}

  publish_aur:
    name: Dispatch AUR bump
    needs: release_meta
    if: needs.release_meta.outputs.is_versioned == 'true'
    uses: evanpurkhiser/workflows/.github/workflows/bump-aur.yml@main
    with:
      package: iptorrents-cli
      version: ${{ needs.release_meta.outputs.tag_name }}
    secrets:
      token: ${{ secrets.AUR_BUMP_DISPATCH_PAT }}
