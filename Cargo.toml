[package]
name = "iptorrents-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for searching and downloading torrents from IPTorrents"
license = "MIT"
repository = "https://github.com/evanpurkhiser/iptorrents-cli"
homepage = "https://github.com/evanpurkhiser/iptorrents-cli"
readme = "README.md"
keywords = ["cli", "torrent", "iptorrents"]
categories = ["command-line-utilities"]

[[bin]]
name = "ipt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.26"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_toon = "0.2"
cookie = "0.18"
toml = "0.9"
thiserror = "2.0"
xdg = "3.0"

[dev-dependencies]
httpmock = "0.8"
tempfile = "3.23"
